{% extends 'base.html' %}

{% block title %}
Update Note | NoteNest
{% endblock %}

{% block content %}

<section class="form-page">

    <div class="form-card">

        <div class="form-header">

            <div class="form-icon">
                ✏️
            </div>

            <h1>
                Update Note
            </h1>

            <p>
                Make changes to your note and save them.
            </p>

        </div>


        <!-- FORM -->

        <form
            method="POST"
            onsubmit="return validateNoteForm();"
        >

            {% csrf_token %}


            <!-- TITLE -->

            <div class="form-group">

                <label for="title">
                    Note Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ note.title }}"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option value="Python"
                        {% if note.category == "Python" %}selected{% endif %}>
                        🐍 Python
                    </option>

                    <option value="Java"
                        {% if note.category == "Java" %}selected{% endif %}>
                        ☕ Java
                    </option>

                    <option value="HTML"
                        {% if note.category == "HTML" %}selected{% endif %}>
                        🌐 HTML
                    </option>

                    <option value="CSS"
                        {% if note.category == "CSS" %}selected{% endif %}>
                        🎨 CSS
                    </option>

                    <option value="JavaScript"
                        {% if note.category == "JavaScript" %}selected{% endif %}>
                        ⚡ JavaScript
                    </option>

                    <option value="SQL"
                        {% if note.category == "SQL" %}selected{% endif %}>
                        🗄️ SQL
                    </option>

                </select>

            </div>


            <!-- CONTENT -->

            <div class="form-group">

                <label for="content">
                    Note Content
                </label>

                <textarea
                    id="content"
                    name="content"
                    rows="10"
                    required
                >{{ note.content }}</textarea>

                <div class="character-count">

                    <span id="charCount">
                        0
                    </span>

                    characters

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="form-buttons">

                <a
                    href="{% url 'note_list' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Update Note
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
